name: Android app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.TSELA_UPLOAD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK (for testing on a phone)
        working-directory: android-app/android
        env:
          TSELA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tsela-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk

      # Signed release bundle for Google Play, built only when the signing secrets exist.
      - name: Decode upload keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TSELA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle (AAB)
        if: steps.keystore.outputs.path != ''
        working-directory: android-app/android
        env:
          TSELA_VERSION_CODE: ${{ github.run_number }}
          TSELA_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          TSELA_KEYSTORE_PASSWORD: ${{ secrets.TSELA_KEYSTORE_PASSWORD }}
          TSELA_KEY_ALIAS: ${{ secrets.TSELA_KEY_ALIAS }}
          TSELA_KEY_PASSWORD: ${{ secrets.TSELA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: tsela-release-aab
          path: android-app/android/app/build/outputs/bundle/release/*.aab
