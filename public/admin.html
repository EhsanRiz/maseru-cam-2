<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Maseru Bridge Traffic Bot</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-dim: rgba(16,185,129,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --yellow: #f59e0b;
      --yellow-dim: rgba(245,158,11,0.12);
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.12);
      --purple: #8b5cf6;
      --purple-dim: rgba(139,92,246,0.12);
      --orange: #f97316;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── LOGIN ── */
    .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
    .login-box { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:2rem; width:100%; max-width:360px; }
    .login-box h1 { font-size:1.4rem; margin-bottom:0.4rem; }
    .login-box p { color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem; }
    .login-box input { width:100%; padding:0.75rem 1rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:1rem; margin-bottom:1rem; }
    .login-box input:focus { outline:none; border-color:var(--accent); }
    .login-box button { width:100%; padding:0.75rem; background:var(--accent); border:none; border-radius:8px; color:white; font-size:1rem; font-weight:600; cursor:pointer; }
    .login-box button:hover { opacity:0.9; }
    .login-error { color:var(--red); font-size:0.85rem; margin-bottom:0.75rem; display:none; }

    /* ── DASHBOARD ── */
    .dashboard { display:none; min-height:100vh; flex-direction:column; }

    /* ── HEADER ── */
    .header { background:var(--bg-card); border-bottom:1px solid var(--border); padding:0.75rem 1.25rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; position:sticky; top:0; z-index:100; }
    .header-left h1 { font-size:1.1rem; font-weight:700; }
    .header-left .subtitle { font-size:0.7rem; color:var(--text-muted); margin-top:0.1rem; }
    .header-right { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .last-updated { font-size:0.7rem; color:var(--text-muted); background:var(--bg); border:1px solid var(--border); padding:0.3rem 0.6rem; border-radius:6px; white-space:nowrap; }
    .last-updated.stale { color:var(--yellow); border-color:var(--yellow); }
    .btn { padding:0.4rem 0.75rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); cursor:pointer; display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; white-space:nowrap; }
    .btn:hover { border-color:var(--accent); color:var(--accent); }
    .btn.danger:hover { border-color:var(--red); color:var(--red); }
    .btn.loading svg { animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── TABS ── */
    .tabs { background:var(--bg-card); border-bottom:1px solid var(--border); display:flex; padding:0 1.25rem; overflow-x:auto; }
    .tab { padding:0.65rem 1rem; font-size:0.82rem; cursor:pointer; color:var(--text-muted); border-bottom:2px solid transparent; transition:all 0.15s; white-space:nowrap; flex-shrink:0; }
    .tab:hover { color:var(--text); }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .tab-badge { display:inline-block; font-size:0.6rem; padding:0.1rem 0.35rem; border-radius:8px; margin-left:0.35rem; font-weight:700; }
    .tab-badge.normal { background:var(--accent-dim); color:var(--accent); }
    .tab-badge.warn { background:var(--yellow-dim); color:var(--yellow); }
    .tab-badge.danger { background:var(--red-dim); color:var(--red); }

    /* ── CONTENT ── */
    .content { padding:1.25rem; max-width:1400px; margin:0 auto; width:100%; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── STAT CARDS ── */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:0.75rem; margin-bottom:1.25rem; }
    .stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:0.9rem 1rem; position:relative; }
    .stat-card.clickable { cursor:pointer; transition:border-color 0.15s, transform 0.1s, box-shadow 0.15s; }
    .stat-card.clickable:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); transform:translateY(-1px); }
    .stat-card.clickable.active-period { border-color:var(--accent); background:linear-gradient(135deg,var(--accent-dim) 0%,transparent 100%); box-shadow:0 0 0 1px var(--accent); }
    .stat-card.clickable.active-period::after { content:'✓'; position:absolute; top:0.4rem; right:0.55rem; font-size:0.6rem; color:var(--accent); font-weight:700; }
    .stat-card.plain-highlight { border-color:var(--accent); background:linear-gradient(135deg,var(--accent-dim) 0%,transparent 100%); }
    .stat-card.warn { border-color:var(--yellow); background:var(--yellow-dim); }
    .stat-card.danger-card { border-color:var(--red); background:var(--red-dim); }
    .stat-card .label { color:var(--text-muted); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.35rem; }
    .stat-card .value { font-size:1.6rem; font-weight:700; color:var(--accent); line-height:1; }
    .stat-card.warn .value { color:var(--yellow); }
    .stat-card.danger-card .value { color:var(--red); }
    .stat-card .sub { color:var(--text-muted); font-size:0.62rem; margin-top:0.25rem; }
    .period-hint { font-size:0.58rem; color:var(--text-muted); margin-top:0.3rem; font-style:italic; }

    /* ── CARDS & CHARTS ── */
    .charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1rem; margin-bottom:1.25rem; }
    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:1rem; }
    .card h3 { font-size:0.78rem; color:var(--text-muted); margin-bottom:0.75rem; }
    .card h3 span { color:var(--text); font-weight:600; }

    /* ── STATUS DIST ── */
    .status-distribution { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media(max-width:520px){ .status-distribution { grid-template-columns:1fr; } }
    .direction-stats h4 { font-size:0.75rem; margin-bottom:0.5rem; }
    .status-bars { display:flex; flex-direction:column; gap:0.4rem; }
    .status-bar-row { display:flex; align-items:center; gap:0.4rem; }
    .status-bar-row .lbl { width:65px; font-size:0.62rem; color:var(--text-muted); }
    .bar-bg { flex:1; height:18px; background:var(--bg); border-radius:4px; overflow:visible; position:relative; }
    .bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding:0 0.4rem; font-size:0.58rem; font-weight:600; color:white; white-space:nowrap; }
    .bar-fill.light { background:var(--accent); }
    .bar-fill.moderate { background:var(--yellow); }
    .bar-fill.heavy { background:var(--orange); }
    .bar-fill.severe { background:var(--red); }

    /* ── HOURLY ── */
    .hourly-chart { display:flex; align-items:flex-end; gap:2px; height:80px; }
    .hour-bar { flex:1; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; position:relative; cursor:pointer; }
    .hour-bar:hover { background:var(--blue); }
    .hour-bar .tip { position:absolute; bottom:105%; left:50%; transform:translateX(-50%); background:var(--bg); border:1px solid var(--border); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.6rem; white-space:nowrap; opacity:0; pointer-events:none; z-index:10; }
    .hour-bar:hover .tip { opacity:1; }
    .hour-labels { display:flex; gap:2px; margin-top:0.35rem; }
    .hour-labels span { flex:1; text-align:center; font-size:0.5rem; color:var(--text-muted); }

    /* ── DAILY ── */
    .daily-chart { display:flex; flex-direction:column; gap:0.35rem; }
    .daily-row { display:flex; align-items:center; gap:0.5rem; }
    .daily-row .day { width:80px; font-size:0.62rem; color:var(--text-muted); flex-shrink:0; }
    .daily-row .bc { flex:1; height:20px; background:var(--bg); border-radius:4px; overflow:hidden; }
    .daily-row .bf { height:100%; background:var(--blue); border-radius:4px; display:flex; align-items:center; padding-left:0.4rem; font-size:0.6rem; font-weight:600; }

    /* ── CACHE ── */
    .cache-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:0.4rem; }
    .cache-item { background:var(--bg); padding:0.5rem; border-radius:6px; font-size:0.62rem; text-align:center; }
    .cache-item .name { color:var(--text-muted); margin-bottom:0.2rem; font-size:0.58rem; }
    .cache-item .status { font-weight:600; }
    .cache-item .status.active { color:var(--accent); }
    .cache-item .status.expired { color:var(--yellow); }
    .cache-item .status.empty { color:var(--text-muted); }

    /* ── FEEDBACK ── */
    .feedback-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media(max-width:600px){ .feedback-grid { grid-template-columns:1fr; } }
    .feedback-list h4 { font-size:0.7rem; color:var(--accent); margin-bottom:0.5rem; }
    .feedback-list.imp h4 { color:var(--yellow); }
    .feedback-item { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--border); font-size:0.75rem; }
    .feedback-item:last-child { border-bottom:none; }
    .feedback-item .cnt { background:var(--bg); padding:0.1rem 0.4rem; border-radius:10px; font-size:0.62rem; font-weight:600; color:var(--accent); }
    .feedback-list.imp .feedback-item .cnt { color:var(--yellow); }

    /* ── INSIGHTS ── */
    .insights { background:var(--purple-dim); border:1px solid var(--purple); border-radius:12px; padding:1rem; margin-bottom:1rem; }
    .insights h3 { font-size:0.78rem; color:var(--purple); margin-bottom:0.75rem; }
    .insight-item { display:flex; gap:0.6rem; padding:0.5rem 0; border-bottom:1px solid rgba(139,92,246,0.2); }
    .insight-item:last-child { border-bottom:none; }
    .insight-item .icon { font-size:1rem; }
    .insight-item .title { font-size:0.78rem; font-weight:600; margin-bottom:0.15rem; }
    .insight-item .desc { font-size:0.68rem; color:var(--text-muted); line-height:1.4; }

    /* ── QUESTIONS ── */
    .questions-list { max-height:380px; overflow-y:auto; }
    .q-item { padding:0.6rem; border-bottom:1px solid var(--border); }
    .q-item:last-child { border-bottom:none; }
    .q-item .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem; flex-wrap:wrap; gap:0.35rem; }
    .q-item .q-time { color:var(--text-muted); font-size:0.62rem; }
    .q-badges { display:flex; gap:0.35rem; }
    .badge { padding:0.1rem 0.3rem; border-radius:4px; font-size:0.55rem; font-weight:600; }
    .badge.light { background:var(--accent-dim); color:var(--accent); }
    .badge.moderate { background:var(--yellow-dim); color:var(--yellow); }
    .badge.heavy { background:rgba(249,115,22,0.15); color:var(--orange); }
    .badge.severe { background:var(--red-dim); color:var(--red); }
    .q-item .q-summary { font-size:0.73rem; line-height:1.4; }
    .q-item .q-rt { color:var(--text-muted); font-size:0.58rem; margin-top:0.2rem; }

    /* ── INFO BOX ── */
    .info-box { background:var(--blue-dim); border:1px solid var(--blue); border-radius:8px; padding:0.5rem 0.9rem; margin-bottom:1rem; font-size:0.73rem; color:var(--blue); }
    .info-box.warn { background:var(--yellow-dim); border-color:var(--yellow); color:var(--yellow); }
    .info-box.danger { background:var(--red-dim); border-color:var(--red); color:var(--red); }
    .info-box.ok { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

    /* ── USERS TAB ── */
    .user-search { width:100%; padding:0.6rem 0.9rem; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.85rem; margin-bottom:1rem; }
    .user-search:focus { outline:none; border-color:var(--accent); }
    .user-table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:0.78rem; }
    thead { position:sticky; top:0; background:var(--bg-card); }
    th { padding:0.5rem 0.75rem; text-align:left; color:var(--text-muted); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.4px; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:0.5rem 0.75rem; border-bottom:1px solid rgba(51,65,85,0.5); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,0.02); }
    .country-bar-wrap { display:flex; flex-direction:column; gap:0.3rem; }
    .country-row { display:flex; align-items:center; gap:0.5rem; }
    .country-row .cname { width:120px; font-size:0.7rem; color:var(--text-muted); flex-shrink:0; }
    .country-row .bc { flex:1; height:16px; background:var(--bg); border-radius:3px; overflow:hidden; }
    .country-row .bf { height:100%; background:var(--purple); border-radius:3px; display:flex; align-items:center; padding-left:0.35rem; font-size:0.58rem; font-weight:600; }
    .pill { display:inline-block; padding:0.1rem 0.45rem; border-radius:10px; font-size:0.62rem; font-weight:600; }
    .pill.ls { background:rgba(16,185,129,0.15); color:var(--accent); }
    .pill.sa { background:rgba(59,130,246,0.15); color:var(--blue); }
    .pill.other { background:rgba(139,92,246,0.15); color:var(--purple); }

    /* ── CAMERA TAB ── */
    .cam-banner { border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.25rem; display:flex; align-items:center; gap:1.25rem; }
    .cam-banner.up { background:linear-gradient(135deg,rgba(16,185,129,0.15) 0%,rgba(16,185,129,0.05) 100%); border:1px solid var(--accent); }
    .cam-banner.stuck { background:linear-gradient(135deg,rgba(245,158,11,0.15) 0%,rgba(245,158,11,0.05) 100%); border:1px solid var(--yellow); }
    .cam-banner.down { background:linear-gradient(135deg,rgba(239,68,68,0.15) 0%,rgba(239,68,68,0.05) 100%); border:1px solid var(--red); }
    .cam-pulse { width:18px; height:18px; border-radius:50%; flex-shrink:0; position:relative; }
    .cam-pulse.green { background:var(--accent); box-shadow:0 0 0 4px rgba(16,185,129,0.2); animation:pulse-green 2s infinite; }
    .cam-pulse.yellow { background:var(--yellow); box-shadow:0 0 0 4px rgba(245,158,11,0.2); animation:pulse-yellow 1.5s infinite; }
    .cam-pulse.red { background:var(--red); box-shadow:0 0 0 4px rgba(239,68,68,0.2); animation:pulse-red 1s infinite; }
    @keyframes pulse-green { 0%,100%{box-shadow:0 0 0 4px rgba(16,185,129,0.2)} 50%{box-shadow:0 0 0 8px rgba(16,185,129,0.05)} }
    @keyframes pulse-yellow { 0%,100%{box-shadow:0 0 0 4px rgba(245,158,11,0.2)} 50%{box-shadow:0 0 0 8px rgba(245,158,11,0.05)} }
    @keyframes pulse-red { 0%,100%{box-shadow:0 0 0 4px rgba(239,68,68,0.25)} 50%{box-shadow:0 0 0 10px rgba(239,68,68,0.05)} }
    .cam-banner-text h2 { font-size:1.1rem; font-weight:700; margin-bottom:0.2rem; }
    .cam-banner-text .sub { font-size:0.72rem; color:var(--text-muted); }
    .cam-banner-text .sub strong { color:var(--text); }

    .angle-timeline { display:flex; align-items:flex-end; gap:3px; padding:0.5rem 0; overflow-x:auto; }
    .angle-block { flex-shrink:0; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:0.55rem; font-weight:700; position:relative; cursor:default; min-width:20px; }
    .angle-block.bridge { background:rgba(16,185,129,0.3); color:var(--accent); border:1px solid rgba(16,185,129,0.4); }
    .angle-block.processing { background:rgba(59,130,246,0.3); color:var(--blue); border:1px solid rgba(59,130,246,0.4); }
    .angle-block.wide { background:rgba(245,158,11,0.3); color:var(--yellow); border:1px solid rgba(245,158,11,0.4); }
    .angle-block.unknown { background:rgba(148,163,184,0.15); color:var(--text-muted); border:1px solid var(--border); }
    .angle-block .tip { position:absolute; bottom:110%; left:50%; transform:translateX(-50%); background:var(--bg); border:1px solid var(--border); padding:0.25rem 0.5rem; border-radius:5px; font-size:0.6rem; white-space:nowrap; opacity:0; pointer-events:none; z-index:20; }
    .angle-block:hover .tip { opacity:1; }
    .angle-legend { display:flex; gap:0.75rem; margin-top:0.5rem; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:0.3rem; font-size:0.65rem; color:var(--text-muted); }
    .legend-dot { width:10px; height:10px; border-radius:2px; }
    .legend-dot.bridge { background:rgba(16,185,129,0.5); }
    .legend-dot.processing { background:rgba(59,130,246,0.5); }
    .legend-dot.wide { background:rgba(245,158,11,0.5); }

    .cycle-health { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.75rem; }
    .cycle-chip { padding:0.3rem 0.75rem; border-radius:20px; font-size:0.7rem; font-weight:600; }
    .cycle-chip.ok { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(16,185,129,0.3); }
    .cycle-chip.warn { background:var(--yellow-dim); color:var(--yellow); border:1px solid rgba(245,158,11,0.3); }
    .cycle-chip.bad { background:var(--red-dim); color:var(--red); border:1px solid rgba(239,68,68,0.3); }

    .cam-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; margin-bottom:1rem; }
    .frame-list { display:flex; flex-direction:column; gap:0.3rem; }
    .frame-row { display:flex; justify-content:space-between; align-items:center; padding:0.35rem 0.5rem; background:var(--bg); border-radius:5px; font-size:0.68rem; }
    .frame-row .fa { font-size:0.6rem; color:var(--text-muted); }
    .freshness-bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:0.5rem; }
    .freshness-fill { height:100%; border-radius:4px; transition:width 1s linear; }
    .freshness-fill.fresh { background:var(--accent); }
    .freshness-fill.aging { background:var(--yellow); }
    .freshness-fill.stale { background:var(--red); }

    /* ── SYSTEM TAB ── */
    .system-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; margin-bottom:1rem; }
    .server-rows { display:flex; flex-direction:column; gap:0.35rem; }
    .server-row { display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; padding:0.3rem 0; border-bottom:1px solid var(--border); }
    .server-row:last-child { border-bottom:none; }
    .server-row .key { color:var(--text-muted); font-size:0.68rem; }
    .server-row .val { font-weight:600; }
    .trend-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; }
    .trend-item { background:var(--bg); padding:0.5rem 0.75rem; border-radius:6px; }
    .trend-item .tk { font-size:0.6rem; color:var(--text-muted); margin-bottom:0.2rem; }
    .tv { font-size:0.85rem; font-weight:700; }
    .tv.increasing { color:var(--red); }
    .tv.decreasing { color:var(--accent); }
    .tv.stable { color:var(--blue); }
    .tv.building_up { color:var(--red); }
    .tv.clearing { color:var(--accent); }
    .tv.unknown, .tv.moving_well { color:var(--text-muted); }
    .tv.slow, .tv.very_slow { color:var(--yellow); }
    .tv.normal { color:var(--blue); }

    /* ── LIVE FRAMES ── */
    .live-frames-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.75rem; margin-bottom:1.25rem; }
    @media(max-width:700px) { .live-frames-grid { grid-template-columns:1fr; } }
    .live-frame-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; position:relative; }
    .live-frame-card.fresh-frame { border-color:var(--accent); }
    .live-frame-card.aging-frame { border-color:var(--yellow); }
    .live-frame-card.stale-frame { border-color:var(--red); }
    .live-frame-card.unavailable-frame { border-color:var(--border); opacity:0.6; }
    .live-frame-img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--bg); }
    .live-frame-img-placeholder { width:100%; aspect-ratio:16/9; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:0.5rem; color:var(--text-muted); font-size:0.75rem; }
    .live-frame-img-placeholder .icon { font-size:2rem; opacity:0.4; }
    .live-frame-meta { padding:0.6rem 0.75rem; }
    .live-frame-meta .angle-name { font-size:0.78rem; font-weight:700; margin-bottom:0.2rem; display:flex; align-items:center; gap:0.4rem; }
    .live-frame-meta .angle-name .dot-sm { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .live-frame-meta .angle-name .dot-sm.bridge { background:var(--accent); }
    .live-frame-meta .angle-name .dot-sm.processing { background:var(--blue); }
    .live-frame-meta .angle-name .dot-sm.wide { background:var(--yellow); }
    .live-frame-meta .frame-time { font-size:0.65rem; color:var(--text-muted); }
    .live-frame-meta .frame-age { font-size:0.62rem; font-weight:600; margin-top:0.15rem; }
    .live-frame-meta .frame-age.fresh { color:var(--accent); }
    .live-frame-meta .frame-age.aging { color:var(--yellow); }
    .live-frame-meta .frame-age.stale { color:var(--red); }
    .live-frame-badge { position:absolute; top:0.4rem; right:0.4rem; padding:0.15rem 0.45rem; border-radius:10px; font-size:0.6rem; font-weight:700; backdrop-filter:blur(4px); }
    .live-frame-badge.fresh { background:rgba(16,185,129,0.85); color:white; }
    .live-frame-badge.aging { background:rgba(245,158,11,0.85); color:white; }
    .live-frame-badge.stale { background:rgba(239,68,68,0.85); color:white; }
    .frames-loading { display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:2rem; color:var(--text-muted); font-size:0.8rem; }

    /* ── LOADING ── */
    .loading { text-align:center; padding:3rem; color:var(--text-muted); }
    .spinner { display:inline-block; width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    .empty-msg { text-align:center; padding:2rem; color:var(--text-muted); font-size:0.8rem; }

    @media(max-width:480px) { .charts-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Admin Login</h1>
    <p>Maseru Bridge Traffic Bot</p>
    <div class="login-error" id="loginError">Invalid password. Please try again.</div>
    <input type="password" id="passwordInput" placeholder="Admin password" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="header">
    <div class="header-left">
      <h1>🌉 Traffic Bot Admin</h1>
      <div class="subtitle">traffic.4dcs.co.za — Maseru Bridge</div>
    </div>
    <div class="header-right">
      <div class="last-updated" id="lastUpdated">Loading…</div>
      <button class="btn" onclick="refreshAll()" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('overview')" id="tab-overview">📊 Overview</div>
    <div class="tab" onclick="switchTab('users')" id="tab-users">👥 Users <span class="tab-badge normal" id="usersCount">—</span></div>
    <div class="tab" onclick="switchTab('camera')" id="tab-camera">📷 Camera <span class="tab-badge normal" id="cameraBadge">—</span></div>
    <div class="tab" onclick="switchTab('system')" id="tab-system">⚙️ System</div>
  </div>

  <div class="content">

    <!-- OVERVIEW -->
    <div class="tab-panel active" id="panel-overview">
      <div id="overviewContent">
        <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading stats…</p></div>
      </div>
    </div>

    <!-- USERS -->
    <div class="tab-panel" id="panel-users">
      <div id="usersContent">
        <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading users…</p></div>
      </div>
    </div>

    <!-- CAMERA -->
    <div class="tab-panel" id="panel-camera">
      <div id="cameraContent">
        <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading camera info…</p></div>
      </div>
    </div>

    <!-- SYSTEM -->
    <div class="tab-panel" id="panel-system">
      <div id="systemContent">
        <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading system info…</p></div>
      </div>
    </div>

  </div>
</div>

<script>
  let adminToken = localStorage.getItem('adminToken');
  let lastRefreshTime = null;
  let overviewInterval = null;
  let cameraInterval = null;
  let countdownInterval = null;
  let activeTab = 'overview';
  let currentPeriod = 'today';
  const OVERVIEW_REFRESH = 60000;
  const CAMERA_REFRESH = 15000; // Camera refreshes every 15s

  if (adminToken) showDashboard();

  /* ─── AUTH ─── */
  async function login() {
    const pw = document.getElementById('passwordInput').value;
    const errEl = document.getElementById('loginError');
    try {
      const res = await fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (data.success) {
        adminToken = data.token;
        localStorage.setItem('adminToken', adminToken);
        errEl.style.display = 'none';
        showDashboard();
      } else {
        errEl.style.display = 'block';
      }
    } catch(e) {
      errEl.textContent = 'Connection error. Please try again.';
      errEl.style.display = 'block';
    }
  }

  function logout() {
    fetch('/api/admin/logout', { method:'POST', headers:{ Authorization:`Bearer ${adminToken}` } });
    localStorage.removeItem('adminToken');
    adminToken = null;
    clearIntervals();
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    refreshAll();
    startIntervals();
  }

  function clearIntervals() {
    clearInterval(overviewInterval);
    clearInterval(cameraInterval);
    clearInterval(countdownInterval);
  }

  function startIntervals() {
    clearIntervals();
    overviewInterval = setInterval(() => {
      if (adminToken && document.visibilityState === 'visible') {
        loadOverview(); loadUsers();
      }
    }, OVERVIEW_REFRESH);

    cameraInterval = setInterval(() => {
      if (adminToken && document.visibilityState === 'visible') {
        loadCamera(); loadSystem();
      }
    }, CAMERA_REFRESH);

    countdownInterval = setInterval(() => {
      updateLastUpdatedLabel();
    }, 1000);
  }

  function updateLastUpdatedLabel() {
    const el = document.getElementById('lastUpdated');
    if (!lastRefreshTime) { el.textContent = 'Loading…'; return; }
    const ago = Math.round((Date.now() - lastRefreshTime) / 1000);
    const nextIn = Math.round(OVERVIEW_REFRESH / 1000) - ago;
    el.textContent = `Updated ${ago}s ago · next in ${Math.max(nextIn,0)}s`;
    el.className = 'last-updated' + (ago > 90 ? ' stale' : '');
  }

  /* ─── TABS ─── */
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    if (tab === 'users') loadUsers();
    if (tab === 'camera') { loadCamera(); }
    if (tab === 'system') loadSystem();
  }

  async function refreshAll() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    await Promise.all([loadOverview(), loadUsers(), loadCamera(), loadSystem()]);
    lastRefreshTime = Date.now();
    updateLastUpdatedLabel();
    btn.classList.remove('loading');
  }

  /* ─── PERIOD SWITCHING ─── */
  function setPeriod(period) {
    currentPeriod = period;
    // Update active-period card styling
    document.querySelectorAll('.stat-card.clickable').forEach(c => {
      c.classList.toggle('active-period', c.dataset.period === period);
    });
    loadOverview();
  }

  /* ─── OVERVIEW ─── */
  async function loadOverview() {
    try {
      const [statsRes, qRes] = await Promise.all([
        fetch(`/api/admin/stats?period=${currentPeriod}`, { headers:{ Authorization:`Bearer ${adminToken}` } }),
        fetch(`/api/admin/questions?period=${currentPeriod}&limit=30`, { headers:{ Authorization:`Bearer ${adminToken}` } })
      ]);
      if (statsRes.status === 401) { logout(); return; }
      const sd = await statsRes.json();
      const qd = await qRes.json();
      if (sd.success) renderOverview(sd.stats, qd.questions || []);
    } catch(e) { console.error('Overview error:', e); }
  }

  function renderOverview(stats, questions) {
    const uptime = stats.server.uptime;
    const h=Math.floor(uptime/3600), m=Math.floor((uptime%3600)/60);
    const uptimeStr = h>0 ? `${h}h ${m}m` : `${m}m`;
    const pl = { today:'Today', week:'This Week', month:'This Month' }[currentPeriod] || 'Today';
    const suggestions = buildSuggestions(stats);

    document.getElementById('overviewContent').innerHTML = `
      <div class="info-box">
        Showing: <strong>${pl}</strong> — ${stats.questions.selectedPeriod} traffic checks.
        <span style="color:var(--text-muted)">Click a period card below to switch.</span>
      </div>

      <div class="stats-grid">
        <div class="stat-card clickable ${currentPeriod==='today'?'active-period':''}" data-period="today" onclick="setPeriod('today')">
          <div class="label">Today</div>
          <div class="value">${stats.questions.today}</div>
          <div class="period-hint">Click to view</div>
        </div>
        <div class="stat-card clickable ${currentPeriod==='week'?'active-period':''}" data-period="week" onclick="setPeriod('week')">
          <div class="label">This Week</div>
          <div class="value">${stats.questions.thisWeek}</div>
          <div class="period-hint">Click to view</div>
        </div>
        <div class="stat-card clickable ${currentPeriod==='month'?'active-period':''}" data-period="month" onclick="setPeriod('month')">
          <div class="label">This Month</div>
          <div class="value">${stats.questions.thisMonth}</div>
          <div class="period-hint">Click to view</div>
        </div>
        <div class="stat-card plain-highlight">
          <div class="label">All Time</div>
          <div class="value">${stats.questions.total}</div>
        </div>
        <div class="stat-card">
          <div class="label">Avg Response</div>
          <div class="value">${stats.avgResponseTimeMs>0?(stats.avgResponseTimeMs/1000).toFixed(1)+'s':'N/A'}</div>
        </div>
        <div class="stat-card">
          <div class="label">Server Uptime</div>
          <div class="value">${uptimeStr}</div>
          <div class="sub">${stats.server.bufferSize} frames</div>
        </div>
      </div>

      <div class="card">
        <h3>🚦 Traffic Status Distribution — <span>${pl}</span></h3>
        <div class="status-distribution">${renderStatusDist(stats.statusDistribution)}</div>
      </div>

      <div class="charts-grid">
        <div class="card"><h3>📈 Activity by Hour</h3>${renderHourly(stats.hourlyDistribution)}</div>
        <div class="card"><h3>📅 Daily Trend</h3>${renderDaily(stats.dailyDistribution)}</div>
      </div>

      <div class="card">
        <h3>💾 Response Cache</h3>
        <div class="cache-grid">${renderCache(stats.cache)}</div>
      </div>

      ${suggestions.length ? `
      <div class="insights">
        <h3>💡 Insights</h3>
        ${suggestions.map(s=>`<div class="insight-item"><div class="icon">${s.icon}</div><div><div class="title">${s.title}</div><div class="desc">${s.desc}</div></div></div>`).join('')}
      </div>` : ''}

      <div class="card">
        <h3>💬 User Feedback — <span>${stats.feedback.total} responses</span></h3>
        <div class="feedback-grid">
          <div class="feedback-list"><h4>👍 What Users Like</h4>${renderFeedback(stats.feedback.likes)}</div>
          <div class="feedback-list imp"><h4>💡 Improvements Wanted</h4>${renderFeedback(stats.feedback.improvements)}</div>
        </div>
      </div>

      <div class="card">
        <h3>🕐 Recent Traffic Checks — <span>${pl}</span></h3>
        <div class="questions-list">${renderQuestions(questions)}</div>
      </div>
    `;
  }

  function renderStatusDist(data) {
    const statuses = ['LIGHT','MODERATE','HEAVY','SEVERE'];
    const dir = (d, label, flag) => {
      const total = Object.values(d).reduce((a,b)=>a+b,0) || 1;
      return `<div class="direction-stats"><h4>${flag} ${label}</h4><div class="status-bars">
        ${statuses.map(s=>{
          const c=d[s]||0, p=Math.round((c/total)*100);
          return `<div class="status-bar-row"><div class="lbl">${s}</div><div class="bar-bg"><div class="bar-fill ${s.toLowerCase()}" style="width:${Math.max(p,c>0?8:0)}%">${c>0?`${c} (${p}%)`:'—'}</div></div></div>`;
        }).join('')}
      </div></div>`;
    };
    return dir(data.lsToSa,'LS → SA','🇱🇸') + dir(data.saToLs,'SA → LS','🇿🇦');
  }

  function renderHourly(data) {
    const max = Math.max(...Object.values(data),1);
    let bars='', labels='';
    for (let h=0; h<24; h++) {
      const c=data[h]||0, ht=(c/max)*100;
      bars += `<div class="hour-bar" style="height:${Math.max(ht,3)}%"><div class="tip">${h}:00 — ${c} checks</div></div>`;
      labels += h%4===0 ? `<span>${h}</span>` : '<span></span>';
    }
    return `<div class="hourly-chart">${bars}</div><div class="hour-labels">${labels}</div>`;
  }

  function renderDaily(data) {
    const days = Object.keys(data).sort().slice(-7);
    if (!days.length) return '<div class="empty-msg">No data yet</div>';
    const max = Math.max(...Object.values(data),1);
    return `<div class="daily-chart">${days.map(d=>{
      const c=data[d], w=(c/max)*100;
      const name = new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      return `<div class="daily-row"><div class="day">${name}</div><div class="bc"><div class="bf" style="width:${Math.max(w,5)}%">${c}</div></div></div>`;
    }).join('')}</div>`;
  }

  function renderCache(cache) {
    const lbl = { status:'Status', good_time:'Good Time', queue:'Queue', ls_to_sa:'LS→SA', sa_to_ls:'SA→LS' };
    return Object.entries(cache).map(([k,v])=>{
      let cls, txt;
      if (!v) { cls='empty'; txt='Empty'; }
      else if (v.valid) { cls='active'; txt=`${v.ageSeconds}s ago`; }
      else { cls='expired'; txt='Expired'; }
      return `<div class="cache-item"><div class="name">${lbl[k]||k}</div><div class="status ${cls}">${txt}</div></div>`;
    }).join('');
  }

  function renderFeedback(data) {
    const lbl = { easy:'Easy to use', fast:'Fast updates', accurate:'Accurate info', design:'Clean design', whatsapp:'WhatsApp share', offline:'Works offline', faster:'Faster loading', waittime:'Wait time estimates', languages:'More languages', notifications:'Push notifications', predictions:'Best time predictions', queue:'Queue in mins' };
    if (!Object.keys(data).length) return '<div class="empty-msg" style="padding:0.5rem">No feedback yet</div>';
    return Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,c])=>`<div class="feedback-item"><span>${lbl[k]||k}</span><span class="cnt">${c}</span></div>`).join('');
  }

  function renderQuestions(questions) {
    if (!questions?.length) return '<div class="empty-msg">No traffic checks for this period</div>';
    return questions.map(q => {
      const time = new Date(q.timestamp).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg',hour12:false});
      const ls=q.ls_to_sa_status, sa=q.sa_to_ls_status;
      const rt=q.response_time_ms?`${(q.response_time_ms/1000).toFixed(1)}s`:'';
      return `<div class="q-item">
        <div class="q-header">
          <span class="q-time">${time}</span>
          <div class="q-badges">
            ${ls?`<span class="badge ${ls.toLowerCase()}">LS→SA: ${ls}</span>`:''}
            ${sa?`<span class="badge ${sa.toLowerCase()}">SA→LS: ${sa}</span>`:''}
          </div>
        </div>
        <div class="q-summary">${q.traffic_summary||'—'}</div>
        ${rt?`<div class="q-rt">⚡ ${rt}</div>`:''}
      </div>`;
    }).join('');
  }

  function buildSuggestions(stats) {
    const s = [];
    const peaks = Object.entries(stats.hourlyDistribution).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([h])=>`${h}:00`);
    if (peaks.length) s.push({ icon:'⏰', title:'Peak Hours', desc:`Most checks at ${peaks.join(', ')} — good window for notifications.` });
    const lsLight=stats.statusDistribution.lsToSa.LIGHT||0;
    const lsTotal=Object.values(stats.statusDistribution.lsToSa).reduce((a,b)=>a+b,0);
    if (lsTotal>10) {
      const pct=Math.round((lsLight/lsTotal)*100);
      if (pct>70) s.push({ icon:'🟢', title:'Mostly Light Traffic', desc:`${pct}% light LS→SA. Great for "best time to cross" alerts.` });
      else if (pct<40) s.push({ icon:'🔴', title:'Heavy Border Period', desc:`Only ${pct}% light traffic. Consider surfacing wait time estimates.` });
    }
    const topImp=Object.entries(stats.feedback.improvements||{}).sort((a,b)=>b[1]-a[1])[0];
    if (topImp) {
      const lbl={ notifications:'Push Notifications', waittime:'Wait Time Estimates', languages:'More Languages', predictions:'Best Time Predictions' };
      s.push({ icon:'📣', title:'Top Request', desc:`${topImp[1]} users want "${lbl[topImp[0]]||topImp[0]}". Consider prioritizing.` });
    }
    if (stats.avgResponseTimeMs>5000) s.push({ icon:'⚡', title:'Slow Responses', desc:`Avg ${(stats.avgResponseTimeMs/1000).toFixed(1)}s — review caching.` });
    return s;
  }

  /* ─── USERS ─── */
  let allUsers = [];
  async function loadUsers() {
    try {
      const res = await fetch('/api/admin/users', { headers:{ Authorization:`Bearer ${adminToken}` } });
      if (res.status===401) { logout(); return; }
      const data = await res.json();
      if (data.success) {
        allUsers = data.users;
        document.getElementById('usersCount').textContent = data.summary.total;
        if (activeTab === 'users') renderUsers(data.summary, data.users);
        else document.getElementById('usersContent').innerHTML = `<div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading users…</p></div>`;
      }
    } catch(e) { console.error('Users error:', e); }
  }

  function renderUsers(summary, users) {
    const byCountry = Object.entries(summary.byCountry).sort((a,b)=>b[1]-a[1]);
    const maxC = byCountry[0]?.[1]||1;
    document.getElementById('usersContent').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card plain-highlight"><div class="label">Total Users</div><div class="value">${summary.total}</div></div>
        <div class="stat-card"><div class="label">New Today</div><div class="value">${summary.newToday}</div></div>
        <div class="stat-card"><div class="label">New This Week</div><div class="value">${summary.newThisWeek}</div></div>
        <div class="stat-card">
          <div class="label">With Email</div><div class="value">${summary.withEmail}</div>
          <div class="sub">${Math.round((summary.withEmail/Math.max(summary.total,1))*100)}% of users</div>
        </div>
        <div class="stat-card">
          <div class="label">No Email</div><div class="value">${summary.total-summary.withEmail}</div>
          <div class="sub">WhatsApp reset only</div>
        </div>
      </div>
      <div class="charts-grid">
        <div class="card">
          <h3>🌍 Users by Country</h3>
          <div class="country-bar-wrap">
            ${byCountry.map(([c,n])=>`<div class="country-row"><div class="cname">${c}</div><div class="bc"><div class="bf" style="width:${Math.round((n/maxC)*100)}%">${n}</div></div></div>`).join('')||'<div class="empty-msg">No data</div>'}
          </div>
        </div>
        <div class="card"><h3>📋 Registrations — Last 14 Days</h3>${renderRegChart(users)}</div>
      </div>
      <div class="card">
        <h3>👤 User List <span style="color:var(--text-muted);font-weight:400;font-size:0.7rem">(${users.length})</span></h3>
        <input class="user-search" type="text" placeholder="Search by name or country…" oninput="filterUsers(this.value)">
        <div class="user-table-wrap" id="userTableWrap">${buildUserTable(users)}</div>
      </div>`;
  }

  function renderRegChart(users) {
    if (!users.length) return '<div class="empty-msg">No users yet</div>';
    const byDay = {};
    const now = new Date();
    for (let i=13; i>=0; i--) { const d=new Date(now); d.setDate(d.getDate()-i); byDay[d.toISOString().split('T')[0]]=0; }
    users.forEach(u => { const d=u.createdAt?.split('T')[0]; if(d&&byDay[d]!==undefined) byDay[d]++; });
    const days=Object.keys(byDay), max=Math.max(...Object.values(byDay),1);
    return `<div class="daily-chart">${days.map(d=>{
      const c=byDay[d], w=(c/max)*100, name=new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      return `<div class="daily-row"><div class="day">${name}</div><div class="bc"><div class="bf" style="width:${Math.max(w,c>0?6:0)}%;background:var(--purple)">${c||''}</div></div></div>`;
    }).join('')}</div>`;
  }

  function buildUserTable(users) {
    if (!users.length) return '<div class="empty-msg">No users found</div>';
    return `<table>
      <thead><tr><th>Name</th><th>Code</th><th>Country</th><th>Email</th><th>Registered</th><th>Last Seen</th></tr></thead>
      <tbody>${users.map(u=>{
        const reg=u.createdAt?new Date(u.createdAt).toLocaleDateString('en-ZA',{timeZone:'Africa/Johannesburg'}):'—';
        const seen=u.lastSeen?timeAgo(new Date(u.lastSeen)):'<span style="color:var(--text-muted)">Never</span>';
        const cc=u.countryCode==='+266'?'ls':u.countryCode==='+27'?'sa':'other';
        const ccLabel=u.countryCode==='+266'?'🇱🇸 LS':u.countryCode==='+27'?'🇿🇦 SA':u.countryCode||'—';
        return `<tr>
          <td>${u.name||'<span style="color:var(--text-muted)">—</span>'}</td>
          <td><span class="pill ${cc}">${ccLabel}</span></td>
          <td>${u.country||'—'}</td>
          <td>${u.hasEmail?'<span title="Has email">✅</span>':'<span title="No email">📵</span>'}</td>
          <td>${reg}</td><td>${seen}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }

  function filterUsers(q) {
    const ql=q.toLowerCase();
    const filtered=allUsers.filter(u=>(u.name||'').toLowerCase().includes(ql)||(u.country||'').toLowerCase().includes(ql));
    document.getElementById('userTableWrap').innerHTML=buildUserTable(filtered);
  }

  /* ─── CAMERA ─── */
  let lastCamData = null;
  let lastFrameData = null;

  async function captureVideoManual() {
    const btn    = document.getElementById('captureVideoBtn');
    const status = document.getElementById('captureVideoStatus');
    const result = document.getElementById('captureVideoResult');
    const duration = document.getElementById('videoDuration')?.value || 8;

    if (!btn) return;

    // Disable button and show capturing state
    btn.disabled = true;
    btn.style.opacity = '0.6';
    btn.innerHTML = '⏳ Capturing…';
    status.textContent = `Capturing ${duration}s clip — check back in ~${parseInt(duration)+25}s`;
    status.style.color = 'var(--yellow)';
    result.style.display = 'none';

    try {
      const res = await fetch(`/api/admin/capture-video?duration=${duration}`, {
        headers: { Authorization: `Bearer ${adminToken}` }
      });
      const data = await res.json();

      if (data.success) {
        status.textContent = '✅ Capture triggered — processing in background…';
        status.style.color = 'var(--accent)';

        // Poll for completion every 3s for up to 45s
        let attempts = 0;
        const maxAttempts = 15;
        const poll = setInterval(async () => {
          attempts++;
          // Check R2 videos via system endpoint isn't feasible,
          // so just show the expected URL after enough time has passed
          if (attempts >= Math.ceil((parseInt(duration) + 20) / 3)) {
            clearInterval(poll);
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.innerHTML = '🎬 Capture Video';
            status.textContent = 'Done — check R2 bucket for videos/manual/';
            status.style.color = 'var(--text-muted)';
            result.style.display = 'block';
            result.innerHTML = `
              <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.3rem">
                📁 Saved to Cloudflare R2 under <code style="background:var(--bg-card);padding:0.1rem 0.3rem;border-radius:4px">videos/manual/</code>
              </div>
              <div style="font-size:0.72rem;color:var(--text-muted)">
                View in your 
                <a href="https://dash.cloudflare.com" target="_blank" style="color:var(--accent)">Cloudflare R2 dashboard</a>
                → maseru-traffic-frames → videos/manual/
              </div>`;
          }
        }, 3000);

      } else {
        status.textContent = `❌ ${data.message || 'Capture failed'}`;
        status.style.color = 'var(--red)';
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = '🎬 Capture Video';
      }
    } catch(e) {
      status.textContent = '❌ Network error — check console';
      status.style.color = 'var(--red)';
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = '🎬 Capture Video';
      console.error('captureVideoManual error:', e);
    }
  }

  async function loadCamera() {
    try {
      const [sysRes, framesRes] = await Promise.all([
        fetch('/api/admin/system', { headers:{ Authorization:`Bearer ${adminToken}` } }),
        fetch('/api/admin/frames',  { headers:{ Authorization:`Bearer ${adminToken}` } })
      ]);
      if (sysRes.status===401) { logout(); return; }
      const sysData    = await sysRes.json();
      const framesData = framesRes.ok ? await framesRes.json() : null;
      if (sysData.success) {
        lastCamData   = sysData;
        lastFrameData = framesData?.success ? framesData.frames : null;
        updateCameraBadge(sysData.camera);
        if (activeTab === 'camera') renderCamera(sysData, lastFrameData);
      }
    } catch(e) { console.error('Camera error:', e); }
  }

  function updateCameraBadge(cam) {
    const badge = document.getElementById('cameraBadge');
    if (cam.status === 'operational') {
      badge.textContent = 'UP'; badge.className = 'tab-badge normal';
    } else if (cam.status === 'stuck_on_angle') {
      badge.textContent = 'STUCK'; badge.className = 'tab-badge warn';
    } else {
      badge.textContent = 'DOWN'; badge.className = 'tab-badge danger';
    }
  }

  function renderCamera(d, frames) {
    const cam = d.camera;
    const angleHistory = d.angleHistory || [];
    const buffer = d.buffer;
    const ANGLE_MAX_AGE_MS = 45 * 60 * 1000;

    // Banner state
    const bannerClass = cam.status==='operational' ? 'up' : cam.status==='stuck_on_angle' ? 'stuck' : 'down';
    const pulseClass = cam.status==='operational' ? 'green' : cam.status==='stuck_on_angle' ? 'yellow' : 'red';
    const statusLabel = cam.status==='operational' ? 'Camera Operational' : cam.status==='stuck_on_angle' ? `Stuck on: ${cam.stuckAngle}` : 'Camera Down';

    const lastCapture = cam.lastSuccessfulCapture ? new Date(cam.lastSuccessfulCapture) : null;
    const lastCaptureStr = lastCapture ? timeAgo(lastCapture) : 'Never';
    const lastCaptureExact = lastCapture ? lastCapture.toLocaleTimeString('en-ZA',{timeZone:'Africa/Johannesburg',hour12:false}) : '—';

    // Frame freshness (how old is the newest frame?)
    const newestFrame = buffer.recentFrames[buffer.recentFrames.length-1];
    const frameAge = newestFrame ? Math.round((Date.now() - new Date(newestFrame.timestamp)) / 1000) : null;
    const freshnessClass = !frameAge ? 'stale' : frameAge < 120 ? 'fresh' : frameAge < 300 ? 'aging' : 'stale';
    const freshnessPct = !frameAge ? 0 : Math.max(0, 100 - Math.round((frameAge / (ANGLE_MAX_AGE_MS/1000)) * 100));

    // Cycle health — check if last N angles have variety
    const unique = new Set(angleHistory.slice(-10)).size;
    let cycleLabel, cycleClass;
    if (cam.status === 'down') { cycleLabel = 'Feed unavailable'; cycleClass='bad'; }
    else if (cam.status === 'stuck_on_angle') { cycleLabel = `Stuck on ${cam.stuckAngle}`; cycleClass='warn'; }
    else if (unique >= 3) { cycleLabel = 'Cycling normally'; cycleClass='ok'; }
    else if (unique >= 2) { cycleLabel = 'Partial cycling'; cycleClass='warn'; }
    else { cycleLabel = 'Single angle only'; cycleClass='warn'; }

    // Angle distribution in buffer
    const angleCounts = buffer.angleCounts;
    const totalFrames = Object.values(angleCounts).reduce((a,b)=>a+b,0)||1;
    const angleNames = { bridge:'Bridge View', processing:'Processing Area', wide:'Wide / Engen' };

    // Timeline — build blocks from angle history
    const timelineHtml = buildAngleTimeline(angleHistory);

    document.getElementById('cameraContent').innerHTML = `
      <!-- Live Frame Images -->
      ${buildLiveFrames(frames)}

      <!-- Status Banner -->
      <div class="cam-banner ${bannerClass}">
        <div class="cam-pulse ${pulseClass}"></div>
        <div class="cam-banner-text">
          <h2>${statusLabel}</h2>
          <div class="sub">
            Last capture: <strong>${lastCaptureStr}</strong> (${lastCaptureExact} SAST) ·
            ${cam.consecutiveFailures} consecutive failure${cam.consecutiveFailures!==1?'s':''}
          </div>
        </div>
      </div>

      ${cam.message ? `<div class="info-box ${bannerClass==='down'?'danger':bannerClass==='stuck'?'warn':''}" style="margin-bottom:1rem">${cam.message}</div>` : ''}

      <!-- Cycle Health & Freshness -->
      <div class="card">
        <h3>🔄 Camera Health</h3>
        <div class="cycle-health">
          <div class="cycle-chip ${cycleClass}">${cycleLabel}</div>
          <div class="cycle-chip ${freshnessClass==='fresh'?'ok':freshnessClass==='aging'?'warn':'bad'}">
            Frames: ${frameAge!==null?`${frameAge}s old`:'No frames'}
          </div>
          <div class="cycle-chip ${buffer.size>0?'ok':'bad'}">Buffer: ${buffer.size}/${buffer.max}</div>
        </div>
        <div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:0.4rem">Frame freshness (${frameAge!==null?frameAge+'s old':'—'})</div>
        <div class="freshness-bar">
          <div class="freshness-fill ${freshnessClass}" style="width:${freshnessPct}%"></div>
        </div>
      </div>

      <!-- Angle Timeline -->
      <div class="card">
        <h3>🎬 Angle Timeline — <span>Last ${angleHistory.length} Classifications</span></h3>
        ${timelineHtml}
        <div class="angle-legend">
          <div class="legend-item"><div class="legend-dot bridge"></div> Bridge View</div>
          <div class="legend-item"><div class="legend-dot processing"></div> Processing Area</div>
          <div class="legend-item"><div class="legend-dot wide"></div> Wide / Engen</div>
        </div>
      </div>

      <div class="cam-grid">
        <!-- Frame Buffer Breakdown -->
        <div class="card">
          <h3>🖼️ Buffer Breakdown — <span>${buffer.size}/${buffer.max} frames</span></h3>
          ${Object.entries(angleCounts).map(([angle,count])=>{
            const pct=Math.round((count/totalFrames)*100);
            const colors={bridge:'var(--accent)',processing:'var(--blue)',wide:'var(--yellow)'};
            return `<div class="country-row" style="margin-bottom:0.4rem">
              <div class="cname" style="width:100px">${angleNames[angle]||angle}</div>
              <div class="bc"><div class="bf" style="width:${pct}%;background:${colors[angle]||'var(--purple)'}">${count} (${pct}%)</div></div>
            </div>`;
          }).join('')||'<div class="empty-msg">Buffer empty</div>'}
        </div>

        <!-- Recent Frames -->
        <div class="card">
          <h3>🕐 Most Recent Frames</h3>
          <div class="frame-list">
            ${buffer.recentFrames.slice().reverse().map(f=>{
              const t=new Date(f.timestamp).toLocaleTimeString('en-ZA',{timeZone:'Africa/Johannesburg',hour12:false});
              const ago=timeAgo(new Date(f.timestamp));
              const colors={bridge:'var(--accent)',processing:'var(--blue)',wide:'var(--yellow)'};
              return `<div class="frame-row">
                <span style="color:${colors[f.angleType]||'var(--text)'}">${f.angleType}</span>
                <span>${t} <span class="fa">(${ago})</span></span>
                <span class="fa">${f.sizeKB} KB</span>
              </div>`;
            }).join('')||'<div class="empty-msg" style="padding:0.5rem">No frames</div>'}
          </div>
        </div>

      </div>

      <!-- Manual Video Capture -->
      <div class="card" style="margin-top:0">
        <h3>🎬 Manual Video Capture</h3>
        <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:1rem">
          Capture a live clip from the HLS stream and save to Cloudflare R2.
          Useful for reviewing traffic conditions or verifying direction detection.
        </p>
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:0.5rem">
            <label style="font-size:0.78rem;color:var(--text-muted)">Duration:</label>
            <select id="videoDuration" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.35rem 0.6rem;font-size:0.78rem;cursor:pointer">
              <option value="5">5 seconds</option>
              <option value="8" selected>8 seconds</option>
              <option value="12">12 seconds</option>
              <option value="15">15 seconds</option>
            </select>
          </div>
          <button id="captureVideoBtn" onclick="captureVideoManual()"
            style="background:var(--accent);color:white;border:none;border-radius:8px;padding:0.45rem 1.1rem;font-size:0.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.4rem;transition:opacity 0.15s">
            🎬 Capture Video
          </button>
          <div id="captureVideoStatus" style="font-size:0.75rem;color:var(--text-muted)"></div>
        </div>
        <div id="captureVideoResult" style="display:none;margin-top:0.85rem;padding:0.65rem 0.85rem;background:var(--bg);border-radius:8px;border:1px solid var(--border)"></div>
      </div>

      <div class="info-box" style="margin-top:0">
        📷 Auto-refreshes every 15 seconds. Last updated: <strong>${new Date().toLocaleTimeString('en-ZA',{timeZone:'Africa/Johannesburg',hour12:false})} SAST</strong>
      </div>
    `;
  }

  function buildLiveFrames(frames) {
    if (!frames) {
      return `<div class="card" style="margin-bottom:1.25rem">
        <h3>📸 Live Camera Frames</h3>
        <div class="frames-loading"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Loading frames…</div>
      </div>`;
    }

    const ANGLE_ORDER = ['bridge', 'processing', 'wide'];
    const sorted = ANGLE_ORDER.map(a => frames.find(f => f.angle === a)).filter(Boolean);

    const cards = sorted.map(f => {
      if (!f.available) {
        return `<div class="live-frame-card unavailable-frame">
          <div class="live-frame-img-placeholder">
            <div class="icon">📷</div>
            <div>${f.label}</div>
            <div style="font-size:0.65rem">No frame captured yet</div>
          </div>
          <div class="live-frame-meta">
            <div class="angle-name"><div class="dot-sm ${f.angle}"></div>${f.label}</div>
            <div class="frame-time">—</div>
            <div class="frame-age stale">Not available</div>
          </div>
        </div>`;
      }

      const ageMin  = Math.round(f.ageSeconds / 60);
      const ageSec  = f.ageSeconds;
      const ageCls  = ageSec < 120 ? 'fresh' : ageSec < 300 ? 'aging' : 'stale';
      const ageLabel = ageSec < 60 ? `${ageSec}s ago` : `${ageMin}m ago`;
      const badgeTxt = ageSec < 120 ? 'LIVE' : ageSec < 300 ? `${ageMin}m old` : `${ageMin}m old`;
      const cardCls  = ageCls + '-frame';

      const captureTime = new Date(f.timestamp).toLocaleTimeString('en-ZA',{
        timeZone:'Africa/Johannesburg', hour12:false
      });

      return `<div class="live-frame-card ${cardCls}">
        <img class="live-frame-img"
             src="data:image/jpeg;base64,${f.imageBase64}"
             alt="${f.label}"
             loading="lazy">
        <div class="live-frame-badge ${ageCls}">${badgeTxt}</div>
        <div class="live-frame-meta">
          <div class="angle-name"><div class="dot-sm ${f.angle}"></div>${f.label}</div>
          <div class="frame-time">Captured at ${captureTime} SAST</div>
          <div class="frame-age ${ageCls}">Updated ${ageLabel}</div>
        </div>
      </div>`;
    });

    const allFresh = sorted.filter(f=>f.available).every(f=>f.ageSeconds<300);
    const noneAvail = sorted.every(f=>!f.available);
    const statusNote = noneAvail
      ? `<div class="info-box danger" style="margin-top:0.75rem;margin-bottom:0">No frames available — camera may be offline or server just restarted</div>`
      : allFresh
        ? `<div class="info-box ok" style="margin-top:0.75rem;margin-bottom:0">✅ All frames fresh — refreshes every 15 seconds</div>`
        : `<div class="info-box warn" style="margin-top:0.75rem;margin-bottom:0">⚠️ Some frames are aging — camera may be cycling slowly or stuck</div>`;

    return `<div class="card" style="margin-bottom:1.25rem">
      <h3>📸 Live Camera Frames <span style="font-weight:400;color:var(--text-muted)">— best preserved frame per angle</span></h3>
      <div class="live-frames-grid">${cards.join('')}</div>
      ${statusNote}
    </div>`;
  }

  function buildAngleTimeline(history) {
    if (!history.length) return '<div class="empty-msg">No angle history yet</div>';

    // Group consecutive same-angle runs into blocks
    const blocks = [];
    let run = { angle: history[0], count: 1 };
    for (let i=1; i<history.length; i++) {
      if (history[i] === run.angle) { run.count++; }
      else { blocks.push(run); run = { angle: history[i], count: 1 }; }
    }
    blocks.push(run);

    const maxCount = Math.max(...blocks.map(b=>b.count));
    const minH = 24, maxH = 56;

    const blocksHtml = blocks.map(b => {
      const h = Math.round(minH + ((b.count/maxCount) * (maxH-minH)));
      const w = Math.max(20, Math.min(60, b.count * 8));
      return `<div class="angle-block ${b.angle}" style="height:${h}px;width:${w}px">
        ${b.count > 1 ? b.count : ''}
        <div class="tip">${b.angle} × ${b.count}</div>
      </div>`;
    }).join('');

    return `<div class="angle-timeline">${blocksHtml}</div>
      <div style="font-size:0.6rem;color:var(--text-muted);margin-top:0.4rem">
        ${blocks.length} angle switches · Block height = consecutive count · Hover for details
      </div>`;
  }

  /* ─── SYSTEM ─── */
  async function loadSystem() {
    try {
      const res = await fetch('/api/admin/system', { headers:{ Authorization:`Bearer ${adminToken}` } });
      if (res.status===401) { logout(); return; }
      const data = await res.json();
      if (data.success && activeTab === 'system') renderSystem(data);
    } catch(e) { console.error('System error:', e); }
  }

  function renderSystem(d) {
    const uptime=d.server.uptime;
    const h=Math.floor(uptime/3600), m=Math.floor((uptime%3600)/60), s=uptime%60;
    const uptimeStr=h>0?`${h}h ${m}m`:m>0?`${m}m ${s}s`:`${s}s`;
    const trends=d.trafficTrends;
    const tv=(t)=>`<span class="tv ${t}">${t||'—'}</span>`;
    const capInterval=Math.round(d.capture.intervalMs/1000);
    const lbl={ status:'Status', good_time:'Good Time', queue:'Queue', ls_to_sa:'LS→SA', sa_to_ls:'SA→LS' };

    document.getElementById('systemContent').innerHTML = `
      <div class="system-grid">

        <div class="card">
          <h3>🖥️ Server</h3>
          <div class="server-rows">
            <div class="server-row"><span class="key">Uptime</span><span class="val">${uptimeStr}</span></div>
            <div class="server-row"><span class="key">Gemini Model</span><span class="val">${d.server.geminiModel}</span></div>
            <div class="server-row"><span class="key">Supabase</span>
              <span class="val" style="color:${d.server.supabaseConnected?'var(--accent)':'var(--red)'}">
                ${d.server.supabaseConnected?'✅ Connected':'❌ Disconnected'}
              </span>
            </div>
            <div class="server-row"><span class="key">Capture Interval</span><span class="val">${capInterval}s</span></div>
            <div class="server-row"><span class="key">Capturing Now</span><span class="val">${d.capture.isCapturing?'🔄 Yes':'⏸ No'}</span></div>
            <div class="server-row"><span class="key">Classifying Now</span><span class="val">${d.capture.isClassifying?'🔍 Yes':'⏸ No'}</span></div>
          </div>
        </div>

        <div class="card">
          <h3>🤖 AI Services</h3>
          <div class="server-rows">
            <div class="server-row"><span class="key">Vision / Classification</span><span class="val">${d.server.geminiModel}</span></div>
            <div class="server-row"><span class="key">Vehicle Detection</span><span class="val">YOLO Microservice</span></div>
            <div class="server-row" style="flex-direction:column;align-items:flex-start;gap:0.2rem">
              <span class="key">Detector URL</span>
              <span class="val" style="font-size:0.65rem;word-break:break-all;color:var(--text-muted)">${d.detector.url}</span>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>📈 Live Traffic Trends</h3>
          <div class="trend-grid">
            <div class="trend-item"><div class="tk">LS → SA</div>${tv(trends.lsToSa?.trend)}</div>
            <div class="trend-item"><div class="tk">SA → LS</div>${tv(trends.saToLs?.trend)}</div>
            <div class="trend-item"><div class="tk">Overall</div>${tv(trends.overall)}</div>
            <div class="trend-item"><div class="tk">Flow Speed</div>${tv(trends.flowSpeed)}</div>
          </div>
          <div class="info-box" style="margin-top:0.75rem;margin-bottom:0">
            Confidence: <strong>${trends.confidence||'—'}</strong>${trends.timePeriod?` · Based on last ${trends.timePeriod} min`:''}
          </div>
        </div>

      </div>

      <div class="card">
        <h3>💾 Response Cache</h3>
        <div class="cache-grid">
          ${Object.entries(d.cache).map(([k,v])=>{
            let cls, txt;
            if (!v) { cls='empty'; txt='Empty'; }
            else if (v.valid) { cls='active'; txt=`${v.ageSeconds}s · ${v.expiresIn}s left`; }
            else { cls='expired'; txt='Expired'; }
            return `<div class="cache-item"><div class="name">${lbl[k]||k}</div><div class="status ${cls}">${txt}</div></div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  /* ─── UTILS ─── */
  function timeAgo(date) {
    const diff = Math.round((Date.now()-date)/1000);
    if (diff<60) return `${diff}s ago`;
    if (diff<3600) return `${Math.round(diff/60)}m ago`;
    if (diff<86400) return `${Math.round(diff/3600)}h ago`;
    return `${Math.round(diff/86400)}d ago`;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState==='visible' && adminToken) {
      const ago = Date.now()-(lastRefreshTime||0);
      if (ago > OVERVIEW_REFRESH) refreshAll();
    }
  });
</script>
